<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aoulink 收益生态测算系统</title>
    <style>
        :root {
            --bg-deep: #0a0c10;
            --panel-bg: #13171f;
            --gold-main: #d4af37;
            --gold-light: #f9d976;
            --gold-dark: #aa8010;
            --text-main: #e2e8f0;
            --text-sub: #94a3b8;
            --border-color: #272c36;
            --highlight-bg: rgba(212, 175, 55, 0.1);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            width: 100%;
            max-width: 480px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.05);
        }
        .header {
            text-align: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }
        .header h2 {
            margin: 0;
            font-size: 22px;
            background: linear-gradient(135deg, var(--gold-light), var(--gold-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }
        .header p {
            margin: 8px 0 0;
            font-size: 12px;
            color: var(--text-sub);
        }
        .form-row {
            display: flex;
            gap: 15px;
        }
        .form-group { margin-bottom: 16px; flex: 1; }
        .form-group label {
            display: block;
            font-size: 13px;
            color: var(--text-sub);
            margin-bottom: 6px;
        }
        .input-wrapper { position: relative; }
        .input-wrapper input, .input-wrapper select {
            width: 100%;
            background: var(--bg-deep);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }
        .input-wrapper input:focus, .input-wrapper select:focus {
            outline: none;
            border-color: var(--gold-main);
            box-shadow: 0 0 0 2px rgba(212, 175, 55, 0.2);
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            margin: 20px 0;
            background: var(--highlight-bg);
            padding: 12px;
            border-radius: 8px;
            border: 1px dashed var(--gold-dark);
        }
        .checkbox-group input {
            appearance: none;
            width: 18px;
            height: 18px;
            border: 2px solid var(--gold-dark);
            border-radius: 4px;
            margin-right: 10px;
            cursor: pointer;
            position: relative;
            flex-shrink: 0;
        }
        .checkbox-group input:checked { background-color: var(--gold-main); }
        .checkbox-group input:checked::after {
            content: '✔'; position: absolute; color: #000; font-size: 12px;
            top: 50%; left: 50%; transform: translate(-50%, -50%); font-weight: bold;
        }
        .checkbox-group label { margin: 0; font-size: 13px; cursor: pointer; color: var(--gold-light); line-height: 1.4; }
        
        button {
            width: 100%;
            background: linear-gradient(135deg, var(--gold-light), var(--gold-dark));
            color: #111;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.3s;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }
        button:active { transform: scale(0.98); }
        button:hover { opacity: 0.9; }

        .result-box {
            margin-top: 25px;
            display: none;
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .result-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 14px;
        }
        .result-row span:first-child { color: var(--text-sub); }
        .result-row span:last-child { font-family: 'Courier New', Courier, monospace; font-weight: bold; }
        .total-row {
            margin-top: 15px;
            background: linear-gradient(90deg, rgba(212,175,55,0.1) 0%, transparent 100%);
            padding: 15px;
            border-radius: 8px;
            border-left: 3px solid var(--gold-main);
        }
        .total-row div { display: flex; justify-content: space-between; margin-bottom: 8px; }
        .total-row div:last-child { margin-bottom: 0; font-size: 18px; color: var(--gold-light); font-weight: bold; }
        .info-tag { font-size: 11px; color: var(--gold-dark); margin-top: 4px; display: block; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>Aoulink 收益模型推演</h2>
        <p>星级联盟 · 资产价值及满血 VIP 收益测算</p>
    </div>

    <div class="form-row">
        <div class="form-group">
            <label>个人投资本金 (U)</label>
            <div class="input-wrapper"><input type="number" id="lpAmount" value="1000"></div>
        </div>
        <div class="form-group">
            <label>团队伞下业绩 (U)</label>
            <div class="input-wrapper"><input type="number" id="teamAmount" value="29000"></div>
            <span class="info-tag">不扣级差，全额参与计算</span>
        </div>
    </div>

    <div class="form-group">
        <label>达标 VIP 等级 (全量拿满该级分润)</label>
        <div class="input-wrapper">
            <select id="vipLevel">
                <option value="0">V0 - 收益 0%</option>
                <option value="0.10">V1 (总业绩≥3千U) - 收益 10%</option>
                <option value="0.30">V2 (总业绩≥1万U) - 收益 30%</option>
                <option value="0.40" selected>V3 (总业绩≥3万U) - 收益 40%</option>
                <option value="0.50">V4 (总业绩≥10万U) - 收益 50%</option>
                <option value="0.60">V5 (总业绩≥30万U) - 收益 60%</option>
                <option value="0.70">V6 (总业绩≥100万U) - 收益 70%</option>
                <option value="0.80">V7 (总业绩≥300万U) - 收益 80%</option>
                <option value="0.90">V8 (总业绩≥1000万U) - 收益 90%</option>
            </select>
        </div>
    </div>
    
    <div class="form-group">
        <label>投资周期</label>
        <div class="input-wrapper">
            <select id="cycle">
                <option value="90">90 天 (送有效本金 0.25% 等值 AOU)</option>
                <option value="180">180 天 (送有效本金 0.5% 等值 AOU)</option>
                <option value="7">7 天 (活动期暂不开放/测算专用)</option>
            </select>
        </div>
    </div>

    <div class="form-row">
        <div class="form-group">
            <label>初始币价 (U) - 保留4位</label>
            <div class="input-wrapper"><input type="number" id="initialPrice" value="0.1314" step="0.0001"></div>
        </div>
        <div class="form-group">
            <label>日涨幅预估 (%) - 保留2位</label>
            <div class="input-wrapper"><input type="number" id="increaseRate" value="3.00" step="0.01"></div>
        </div>
    </div>

    <div class="checkbox-group">
        <input type="checkbox" id="isCompounding">
        <label for="isCompounding">开启复投<br><span style="font-size:11px; color:var(--text-sub);">7天: 收益仅换币，不增本金<br>90/180天: U利润满100全额并入本金实现复利</span></label>
    </div>

    <button onclick="calculate()">生成高精收益报告</button>

    <div class="result-box" id="resultBox">
        <div class="result-row">
            <span>首日个人静态收益 (1%)</span>
            <span id="resDailyStatic">0.00 U</span>
        </div>
        <div class="result-row">
            <span>首日 VIP 满血收益</span>
            <span id="resDailyVip">0.00 U</span>
        </div>
        <div class="result-row">
            <span>首日空投对应 U 价值</span>
            <span id="resDailyAouUsdt">0.00 U</span>
        </div>
        <div class="result-row">
            <span>首日实获 AOU 数量</span>
            <span id="resDailyCoin">0.00 个</span>
        </div>
        <div class="result-row">
            <span>周期总获得 AOU 币量</span>
            <span id="resTotalCoin">0.00 个</span>
        </div>
        <div class="result-row">
            <span>期末 AOU 总价值</span>
            <span id="resCoinValue">0.00 U</span>
        </div>
        <div class="result-row">
            <span>提现损耗 (总资产3% + 1U)</span>
            <span id="resFee" style="color: #d9534f;">-0.00 U</span>
        </div>
        <div class="result-row">
            <span>净法币理财总收益 (已扣费)</span>
            <span id="resNetStatic">0.00 U</span>
        </div>
        
        <div class="total-row">
            <div>
                <span>期末预计币价:</span>
                <span id="resFinalPrice">0.0000 U</span>
            </div>
            <div>
                <span>生态综合净收益 (U+币):</span>
                <span id="resGrandTotal">0.00 U</span>
            </div>
        </div>
    </div>
</div>

<script>
    function calculate() {
        const lpInput = parseFloat(document.getElementById('lpAmount').value) || 0;
        const teamInput = parseFloat(document.getElementById('teamAmount').value) || 0;
        const vipRate = parseFloat(document.getElementById('vipLevel').value) || 0;
        const cycle = parseInt(document.getElementById('cycle').value);
        
        // 精度控制：初始币价4位，涨幅2位
        const initialPrice = parseFloat(parseFloat(document.getElementById('initialPrice').value).toFixed(4)) || 0;
        const increaseRate = parseFloat(parseFloat(document.getElementById('increaseRate').value).toFixed(2)) / 100 || 0;
        const isCompounding = document.getElementById('isCompounding').checked;

        if(lpInput <= 0 || initialPrice <= 0) return alert("请输入有效的本金和币价");

        let personalLP = lpInput;
        let unreinvestedProfit = 0;
        let totalCoins = 0;
        let currentPrice = initialPrice;

        let firstDayStatic = 0;
        let firstDayVip = 0;
        let firstDayAouUsdt = 0;
        let firstDayCoin = 0;

        for (let day = 1; day <= cycle; day++) {
            // ==========================================
            // 模块一：法币理财收益计算（U本位）
            // ==========================================
            let totalVolume = personalLP + teamInput; // 总业绩动态计算（个人本金变大，总业绩也会变大）
            let dailyStatic = personalLP * 0.01;      // 个人本金 1% 静态
            
            // 【无级差VIP逻辑】：不扣减任何大区业绩，直接按总业绩 * 1% * VIP比例 拿满！
            let dailyVip = totalVolume * 0.01 * vipRate; 
            
            // 所有产生的U全部先放进“未复投利润池”
            unreinvestedProfit += (dailyStatic + dailyVip);

            // ==========================================
            // 模块二：空投代币价值提取与换算（金本位空投逻辑）
            // ==========================================
            let dailyAouUsdtValue = 0;
            if (cycle === 7) {
                // 7天模式：只有开启复投时，才释放相当于本金 万分之一 的U价值去买币
                if (isCompounding) {
                    dailyAouUsdtValue = personalLP * 0.0001; 
                }
            } else if (cycle === 90) {
                // 【90天逻辑】：每日空投 U 价值 = 当日有效本金 × 0.25%
                dailyAouUsdtValue = personalLP * 0.0025;
            } else if (cycle === 180) {
                // 【180天逻辑】：每日空投 U 价值 = 当日有效本金 × 0.5%
                dailyAouUsdtValue = personalLP * 0.005;
            }

            // 【币量折算】：将今日锁定的空投U价值，按今日飙升的实盘币价换算成真正到手的代币数量
            let dailyCoin = dailyAouUsdtValue > 0 ? (dailyAouUsdtValue / currentPrice) : 0;
            totalCoins += dailyCoin;

            // 记录首日数据用于界面展示
            if (day === 1) {
                firstDayStatic = dailyStatic;
                firstDayVip = dailyVip;
                firstDayAouUsdt = dailyAouUsdtValue;
                firstDayCoin = dailyCoin;
            }

            // ==========================================
            // 模块三：触发复利机制与次日环境刷新
            // ==========================================
            // 90/180天模式下：如果开启了复投，且利润池U >= 100
            if (isCompounding && cycle !== 7) {
                if (unreinvestedProfit >= 100) {
                    personalLP += unreinvestedProfit; // 利润全额转本金！实现真正的滚雪球
                    unreinvestedProfit = 0;           // 利润池清零
                }
            }

            // 刷新第二天的币价
            if (day < cycle) {
                currentPrice *= (1 + increaseRate);
            }
        }

        // ==========================================
        // 模块四：期末清算核销
        // ==========================================
        // 总资产 = 滚大的本金 + 零散的利润池
        const grossBalance = personalLP + unreinvestedProfit; 
        
        // 提现手续费统一扣除：3% + 1U
        const withdrawalFee = (grossBalance * 0.03) + 1; 
        const netBalance = grossBalance - withdrawalFee;
        
        // 净赚法币利润 = 提现到手的U - 投资时最初掏出的本金U
        const netStaticProfit = netBalance - lpInput; 
        
        // 期末手中AOU的总价值 = 总币量 * 最后一天的币价
        const totalCoinValue = totalCoins * currentPrice;
        
        // 最终生态大满贯收益 = 法币净利润 + 代币总价值
        const grandTotal = netStaticProfit + totalCoinValue;

        // --- 数据渲染 ---
        document.getElementById('resDailyStatic').innerText = firstDayStatic.toFixed(2) + ' U';
        document.getElementById('resDailyVip').innerText = firstDayVip.toFixed(2) + ' U';
        document.getElementById('resDailyAouUsdt').innerText = firstDayAouUsdt.toFixed(2) + ' U';
        document.getElementById('resDailyCoin').innerText = firstDayCoin.toFixed(4) + ' 个';
        document.getElementById('resTotalCoin').innerText = totalCoins.toFixed(4) + ' 个';
        document.getElementById('resCoinValue').innerText = totalCoinValue.toFixed(2) + ' U';
        document.getElementById('resFee').innerText = '-' + withdrawalFee.toFixed(2) + ' U';
        document.getElementById('resNetStatic').innerText = netStaticProfit.toFixed(2) + ' U';
        document.getElementById('resFinalPrice').innerText = currentPrice.toFixed(4) + ' U';
        document.getElementById('resGrandTotal').innerText = grandTotal.toFixed(2) + ' U';

        document.getElementById('resultBox').style.display = 'block';
    }
</script>
</body>
</html>
