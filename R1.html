<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aoulink 收益生态测算系统</title>
    <style>
        :root {
            --bg-deep: #0a0c10;
            --panel-bg: #13171f;
            --gold-main: #d4af37;
            --gold-light: #f9d976;
            --gold-dark: #aa8010;
            --text-main: #e2e8f0;
            --text-sub: #94a3b8;
            --border-color: #272c36;
            --highlight-bg: rgba(212, 175, 55, 0.1);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.05);
        }
        .header {
            text-align: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }
        .header h2 {
            margin: 0;
            font-size: 22px;
            background: linear-gradient(135deg, var(--gold-light), var(--gold-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }
        .header p {
            margin: 8px 0 0;
            font-size: 12px;
            color: var(--text-sub);
        }
        .form-group { margin-bottom: 16px; }
        .form-group label {
            display: block;
            font-size: 13px;
            color: var(--text-sub);
            margin-bottom: 6px;
        }
        .input-wrapper { position: relative; }
        .input-wrapper input, .input-wrapper select {
            width: 100%;
            background: var(--bg-deep);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 15px;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }
        .input-wrapper input:focus, .input-wrapper select:focus {
            outline: none;
            border-color: var(--gold-main);
            box-shadow: 0 0 0 2px rgba(212, 175, 55, 0.2);
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            margin: 20px 0;
            background: var(--highlight-bg);
            padding: 12px;
            border-radius: 8px;
            border: 1px dashed var(--gold-dark);
        }
        .checkbox-group input {
            appearance: none;
            width: 18px;
            height: 18px;
            border: 2px solid var(--gold-dark);
            border-radius: 4px;
            margin-right: 10px;
            cursor: pointer;
            position: relative;
        }
        .checkbox-group input:checked { background-color: var(--gold-main); }
        .checkbox-group input:checked::after {
            content: '✔'; position: absolute; color: #000; font-size: 12px;
            top: 50%; left: 50%; transform: translate(-50%, -50%); font-weight: bold;
        }
        .checkbox-group label { margin: 0; font-size: 14px; cursor: pointer; color: var(--gold-light); }
        
        button {
            width: 100%;
            background: linear-gradient(135deg, var(--gold-light), var(--gold-dark));
            color: #111;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.3s;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }
        button:active { transform: scale(0.98); }
        button:hover { opacity: 0.9; }

        .result-box {
            margin-top: 25px;
            display: none;
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .result-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 14px;
        }
        .result-row span:first-child { color: var(--text-sub); }
        .result-row span:last-child { font-family: 'Courier New', Courier, monospace; font-weight: bold; }
        .total-row {
            margin-top: 15px;
            background: linear-gradient(90deg, rgba(212,175,55,0.1) 0%, transparent 100%);
            padding: 15px;
            border-radius: 8px;
            border-left: 3px solid var(--gold-main);
        }
        .total-row div { display: flex; justify-content: space-between; margin-bottom: 8px; }
        .total-row div:last-child { margin-bottom: 0; font-size: 18px; color: var(--gold-light); font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>Aoulink 共识月生态测算</h2>
        <p>星火系统所有权 · 资产价值预演</p>
    </div>

    <div class="form-group">
        <label>投资 LP 金额 (U)</label>
        <div class="input-wrapper"><input type="number" id="lpAmount" value="1000"></div>
    </div>
    
    <div class="form-group">
        <label>投资周期</label>
        <div class="input-wrapper">
            <select id="cycle">
                <option value="90">90 天 (额外赠送 0.25% AOU)</option>
                <option value="180">180 天 (额外赠送 0.5% AOU)</option>
                <option value="7">7 天 (活动期暂不开放/测算专用)</option>
            </select>
        </div>
    </div>

    <div class="form-group">
        <label>起始日 AOU 币价 (U)</label>
        <div class="input-wrapper"><input type="number" id="initialPrice" value="0.1314" step="0.0001"></div>
    </div>

    <div class="form-group">
        <label>AOU 预估每日涨幅 (%)</label>
        <div class="input-wrapper"><input type="number" id="increaseRate" value="3" step="0.1"></div>
    </div>

    <div class="checkbox-group">
        <input type="checkbox" id="isCompounding">
        <label for="isCompounding">开启复投机制 (收益满100U自动复投)</label>
    </div>

    <button onclick="calculate()">生成收益报告</button>

    <div class="result-box" id="resultBox">
        <div class="result-row">
            <span>首日实际静态收益 (1%)</span>
            <span id="resDailyStatic">0.00 U</span>
        </div>
        <div class="result-row">
            <span>首日获取 AOU 数量</span>
            <span id="resDailyCoin">0.00 个</span>
        </div>
        <div class="result-row">
            <span>周期总获得 AOU 币量</span>
            <span id="resTotalCoin">0.00 个</span>
        </div>
        <div class="result-row">
            <span>期末 AOU 总价值</span>
            <span id="resCoinValue">0.00 U</span>
        </div>
        <div class="result-row">
            <span>净静态收益 (扣3%及1U提现费)</span>
            <span id="resNetStatic">0.00 U</span>
        </div>
        
        <div class="total-row">
            <div>
                <span>期末预计币价:</span>
                <span id="resFinalPrice">0.0000 U</span>
            </div>
            <div>
                <span>综合总收益 (静态+币增值):</span>
                <span id="resGrandTotal">0.00 U</span>
            </div>
        </div>
    </div>
</div>

<script>
    function calculate() {
        const lpInput = parseFloat(document.getElementById('lpAmount').value) || 0;
        const cycle = parseInt(document.getElementById('cycle').value);
        const initialPrice = parseFloat(document.getElementById('initialPrice').value) || 0;
        const increaseRate = parseFloat(document.getElementById('increaseRate').value) / 100 || 0;
        const isCompounding = document.getElementById('isCompounding').checked;

        if(lpInput <= 0 || initialPrice <= 0) return alert("请输入有效的金额和币价");

        let principal = lpInput;
        let unreinvestedProfit = 0;
        let totalCoins = 0;
        let currentPrice = initialPrice;

        let firstDayStatic = 0;
        let firstDayCoin = 0;

        for (let day = 1; day <= cycle; day++) {
            // 1. 计算当日静态收益 (本金1%)
            let dailyStatic = principal * 0.01;
            unreinvestedProfit += dailyStatic;

            if (day === 1) firstDayStatic = dailyStatic;

            // 2. 判断复投 (满100U自动并入本金)
            if (isCompounding && unreinvestedProfit >= 100) {
                principal += unreinvestedProfit;
                unreinvestedProfit = 0;
            }

            // 3. 计算当日获得的币量
            let dailyCoin = 0;
            if (cycle === 7) {
                if (isCompounding) {
                    dailyCoin = (principal * 0.0001) / currentPrice; // 收益(1%)的1% = 万分之一
                }
            } else if (cycle === 90) {
                dailyCoin = (principal * 0.0025) / currentPrice;
            } else if (cycle === 180) {
                dailyCoin = (principal * 0.005) / currentPrice;
            }

            if (day === 1) firstDayCoin = dailyCoin;
            totalCoins += dailyCoin;

            // 4. 更新第二天币价
            if (day < cycle) {
                currentPrice *= (1 + increaseRate);
            }
        }

        // --- 结算核算 ---
        // 提现手续费统一为：3%（本金+利润）+ 每次提现1U（按期末一次性提现核算）
        const grossBalance = principal + unreinvestedProfit; 
        const withdrawalFee = (grossBalance * 0.03) + 1; // 此处已补充 +1U
        const netBalance = grossBalance - withdrawalFee;
        
        // 净静态收益 = 提现到手金额 - 初始投入本金
        const netStaticProfit = netBalance - lpInput; 
        
        // 币的总价值
        const totalCoinValue = totalCoins * currentPrice;
        
        // 综合总收益
        const grandTotal = netStaticProfit + totalCoinValue;

        // --- 数据渲染 ---
        document.getElementById('resDailyStatic').innerText = firstDayStatic.toFixed(2) + ' U';
        document.getElementById('resDailyCoin').innerText = firstDayCoin.toFixed(4) + ' 个';
        document.getElementById('resTotalCoin').innerText = totalCoins.toFixed(4) + ' 个';
        document.getElementById('resCoinValue').innerText = totalCoinValue.toFixed(2) + ' U';
        document.getElementById('resNetStatic').innerText = netStaticProfit.toFixed(2) + ' U';
        document.getElementById('resFinalPrice').innerText = currentPrice.toFixed(4) + ' U';
        document.getElementById('resGrandTotal').innerText = grandTotal.toFixed(2) + ' U';

        document.getElementById('resultBox').style.display = 'block';
    }
</script>
</body>
</html>
